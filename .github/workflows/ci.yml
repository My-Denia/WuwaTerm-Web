name: Web CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global --no-audit npm@11.6.2
      - run: npm ci --no-audit
      - run: npm audit --json
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:no-client-secret
      - run: npm run test:built
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          WUWATERM_BROWSER_BUILT: '1'
      - run: npm run build:selfhost
        env:
          NEXT_PUBLIC_WUWATERM_BASE_PATH: /private
      - run: node tests/helpers/private-standalone-smoke.mjs /private
        env:
          TASK_STATE_ROOT: ${{ runner.temp }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read immutable backend revision
        id: backend
        run: |
          set -euo pipefail
          revision=$(cat contracts/backend-ref.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Web source: $(git rev-parse HEAD)"
          echo "Backend source: $revision"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm
          ref: ${{ steps.backend.outputs.revision }}
          path: backend
      - name: Read immutable Windows revision
        id: windows
        run: |
          set -euo pipefail
          revision=$(cat contracts/windows-ref.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Windows
          ref: ${{ steps.windows.outputs.revision }}
          path: windows
      - name: Verify Windows source revision
        run: |
          set -euo pipefail
          actual=$(git -C windows rev-parse HEAD)
          echo "Windows source: $actual"
          test "$actual" = '${{ steps.windows.outputs.revision }}'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: npm run test:contract
        env:
          WUWATERM_BACKEND_ROOT: ${{ github.workspace }}/backend
          WUWATERM_WINDOWS_ROOT: ${{ github.workspace }}/windows
      - run: python -m pytest -m cross_component tests/test_meta_site_contract.py
        working-directory: backend
        env:
          WUWATERM_WEB_ROOT: ${{ github.workspace }}
