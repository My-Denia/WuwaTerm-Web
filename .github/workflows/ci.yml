name: Web CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The install step below bounds each of its three attempts at 3 min and its
    # fallback at another 3, so a dead mirror costs about 10 min there instead of
    # the 10 min a single attempt already spent on 2026-11-11; with the browser
    # suite that follows, 20 min covers the worst case that still reaches the
    # fallback. At the previous 15 min ceiling a dead mirror could cancel the job
    # mid-retry, which is the failure this change exists to remove. A healthy run
    # still finishes in about 4 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global --no-audit npm@11.6.2
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:no-client-secret
      - run: npm run test:built
      # 2026-11-11, run 43033222869: all four attempts of this job died in
      # `npx playwright install --with-deps chromium` while every earlier step
      # passed, and the same step took 19s on the same commit twenty minutes
      # earlier. The failure was apt's own line,
      #   E: Failed to fetch ... Temporary failure resolving 'azure.archive.ubuntu.com'
      # so the mirror's DNS decided the job. Resolving the mirror is the runner
      # image's property, not this repository's; a package that is genuinely
      # missing is this repository's problem. The step separates the two: three
      # bounded attempts with 5s/15s backoff for anything transient, no retry at
      # all for a package apt cannot find, and then a browser-only install that
      # says the system libraries were not installed. If the fallback also
      # fails, or chromium cannot launch after it, the step is red and names the
      # cause; a green step here never claims the system dependencies were
      # installed when they were not.
      #
      # The cache holds the browser binary only, never the OS packages, so
      # `--with-deps` still runs on every attempt, cache hit included: once the
      # download is skipped that is the cheap part, and skipping it would make
      # the system-dependency check depend on whatever the image happens to
      # ship. The key carries the resolved @playwright/test version because that
      # version pins the chromium build.
      - name: Read Playwright version for the browser cache key
        id: playwright-version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: bash .github/scripts/install-playwright-chromium.sh
      - run: npm run test:browser
        env:
          WUWATERM_BROWSER_BUILT: '1'
      # A browser flake that only passes on retry leaves the job green, so the
      # trace has to be published unconditionally; without it the failed attempt
      # leaves nothing behind except the reporter text.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: .wrangler/browser-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build:selfhost
        env:
          NEXT_PUBLIC_WUWATERM_BASE_PATH: /private
      - run: node tests/helpers/private-standalone-smoke.mjs /private
        env:
          TASK_STATE_ROOT: ${{ runner.temp }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck
  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read immutable backend revision
        id: backend
        run: |
          set -euo pipefail
          revision=$(cat contracts/backend-ref.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Web source: $(git rev-parse HEAD)"
          echo "Backend source: $revision"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm
          ref: ${{ steps.backend.outputs.revision }}
          path: backend
      - name: Read immutable Windows revision
        id: windows
        run: |
          set -euo pipefail
          revision=$(cat contracts/windows-ref.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Windows
          ref: ${{ steps.windows.outputs.revision }}
          path: windows
      - name: Verify Windows source revision
        run: |
          set -euo pipefail
          actual=$(git -C windows rev-parse HEAD)
          echo "Windows source: $actual"
          test "$actual" = '${{ steps.windows.outputs.revision }}'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: npm run test:contract
        env:
          WUWATERM_BACKEND_ROOT: ${{ github.workspace }}/backend
          WUWATERM_WINDOWS_ROOT: ${{ github.workspace }}/windows
      - run: python -m pytest -m cross_component tests/test_meta_site_contract.py
        working-directory: backend
        env:
          WUWATERM_WEB_ROOT: ${{ github.workspace }}
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global --no-audit npm@11.6.2
      - run: npm ci --no-audit
      - run: npm audit --json
